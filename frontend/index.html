<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joy AI</title>
<meta name="description" content="A duet. Internet opinions about AI, read aloud verbatim by two faces, each in the wrong voice.">
<meta name="theme-color" content="#07060b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='4' fill='%23ff9a3c'/%3E%3Ccircle cx='11' cy='8' r='4' fill='%234f7dff' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/joy.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>

<main class="piece">
  <header class="title">
    <h1>Joy AI</h1>
    <p>a duet</p>
  </header>

  <section class="duet">
    <article class="voice" data-avatar="HappyAvatar">
      <div class="face" id="face-HappyAvatar"></div>
      <div class="plate">
        <span class="name">Joy</span>
        <span class="slip" id="slip-HappyAvatar" aria-hidden="true"></span>
      </div>
      <div class="lines" id="lines-HappyAvatar" aria-live="polite"></div>
    </article>

    <article class="voice offset" data-avatar="SadAvatar">
      <div class="face" id="face-SadAvatar"></div>
      <div class="plate">
        <span class="name">Sorrow</span>
        <span class="slip" id="slip-SadAvatar" aria-hidden="true"></span>
      </div>
      <div class="lines" id="lines-SadAvatar" aria-live="polite"></div>
    </article>
  </section>

  <footer class="controls">
    <span class="status" id="status"><i class="dot"></i><span id="wsstate">connecting</span></span>
    <button id="demo" type="button" title="Run the piece on rehearsal material (R)">rehearsal</button>
    <button id="sound" class="invite" type="button" aria-pressed="false" title="Toggle the voices (M)">turn the voices on</button>
  </footer>
</main>

<noscript><p class="noscript">Joy AI is a live piece and needs JavaScript to perform.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
